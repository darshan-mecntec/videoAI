openapi: 3.0.3
info:
  title: Template Engine & Prompt Engine API
  version: 1.0.0
  description: Manages curated starter workflow templates, template forking to Workflow Engine, prompt variable interpolation, and safety/token budgeting.
paths:
  /v1/templates:
    get:
      summary: List curated workflow templates
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: modality
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: List of workflow templates
    post:
      summary: Create new workflow template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title]
      responses:
        '201':
          description: Template created

  /v1/templates/{id}:
    get:
      summary: Get template details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template details

  /v1/templates/{id}/fork:
    post:
      summary: Fork template into executable Workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                custom_name:
                  type: string
      responses:
        '201':
          description: Template forked successfully

  /v1/prompts/render:
    post:
      summary: Render prompt template with {{variable}} substitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_text]
      responses:
        '200':
          description: Rendered prompt text

  /v1/prompts/lint:
    post:
      summary: Lint prompt for token length and safety checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
      responses:
        '200':
          description: Prompt linting results
