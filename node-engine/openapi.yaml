openapi: 3.0.3
info:
  title: Node Engine API
  version: 1.0.0
  description: Defines typed port contracts, parameter schemas, and graph port-type compatibility validation for visual workflow canvas nodes.
paths:
  /v1/nodes:
    get:
      summary: List available node definitions
      parameters:
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: List of node definitions
    post:
      summary: Register custom node definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
      responses:
        '201':
          description: Node registered successfully

  /v1/nodes/{type}:
    get:
      summary: Get detailed node definition and port schemas
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node definition details
        '404':
          description: Node type not found

  /v1/nodes/validate-graph:
    post:
      summary: Validate edge connections and port data-type compatibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodes, edges]
      responses:
        '200':
          description: Graph validation result
